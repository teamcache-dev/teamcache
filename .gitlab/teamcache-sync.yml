# TeamCache sync job — include this in your .gitlab-ci.yml:
#
#   include:
#     - local: .gitlab/teamcache-sync.yml
#
# Or copy the job definition directly into your pipeline.

teamcache-sync:
  stage: .post
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pip install --quiet teamcache
  script:
    - teamcache sync
    - teamcache invalidate --stale
    - teamcache index
    - |
      git config user.email "ci@gitlab"
      git config user.name "GitLab CI"
      git add .teamcache/objects/
      git diff --staged --quiet || git commit -m "chore: teamcache sync [skip ci]"
    - git push "https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_BRANCH}
  # No API key required — CI only runs the static indexer.
  # AI summaries are contributed by developers during their sessions.
