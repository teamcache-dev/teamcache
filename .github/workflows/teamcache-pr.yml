name: TeamCache PR Coverage

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TeamCache
        run: pip install teamcache

      - name: Check changed file summaries
        id: coverage
        shell: bash
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed_files.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          summaries_root = Path(".teamcache/objects/summaries")
          changed_files = [
              line.strip()
              for line in Path("changed_files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          def cache_prefix(path: Path) -> str | None:
              try:
                  content = path.read_bytes()
              except OSError:
                  return None
              file_hash = hashlib.sha256(content).hexdigest()
              cache_key = hashlib.sha256(f"{file_hash}|v2".encode()).hexdigest()
              return cache_key[:2]

          def has_ai_summary(rel_path: str) -> bool:
              prefix = cache_prefix(Path(rel_path))
              if not prefix:
                  return False
              summary_dir = summaries_root / prefix
              if not summary_dir.is_dir():
                  return False
              file_path_marker = f'"file_path": "{rel_path}"'
              for summary_file in summary_dir.glob("*.json"):
                  try:
                      text = summary_file.read_text(encoding="utf-8")
                  except OSError:
                      continue
                  if file_path_marker not in text:
                      continue
                  try:
                      obj = json.loads(text)
                  except json.JSONDecodeError:
                      continue
                  if obj.get("file_path") == rel_path and obj.get("summary_type") == "ai":
                      return True
              return False

          missing = [
              rel_path
              for rel_path in changed_files
              if Path(rel_path).is_file() and not has_ai_summary(rel_path)
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"total={len(changed_files)}\n")
              output.write(f"missing={len(missing)}\n")
          PY

      - name: Comment on PR
        if: steps.coverage.outputs.missing >= 2 || steps.coverage.outputs.missing == 0
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const total = Number("${{ steps.coverage.outputs.total }}");
            const missing = Number("${{ steps.coverage.outputs.missing }}");
            const marker = "<!-- teamcache-pr-coverage -->";
            const body = missing === 0
              ? `${marker}\n✅ TeamCache: All changed files have AI summaries.`
              : `${marker}\n⚡ **TeamCache**: ${missing} of ${total} changed files have no AI summary.\nConsider reading them this session to generate context for your team.\nRun \`teamcache stats\` to see coverage.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
