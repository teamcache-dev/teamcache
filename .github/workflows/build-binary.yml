name: Build Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact: teamcache-linux-x64
          - os: macos-13
            target: macos-x64
            artifact: teamcache-macos-x64
          - os: macos-latest
            target: macos-arm64
            artifact: teamcache-macos-arm64
          - os: windows-latest
            target: windows-x64
            artifact: teamcache-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          pip install pyinstaller
          pip install ".[symbols]"

      - name: Build binary (no embeddings — keeps binary ~15MB)
        run: pyinstaller --onefile --name ${{ matrix.artifact }} --hidden-import teamcache --collect-submodules teamcache teamcache/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
